<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido recibido | Cábala Pastas</title>
<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#C86F3D;
    font-family: Georgia, serif;
    padding:20px;
}
.card{
    background:#FAF6F1;
    max-width:700px;
    text-align:center;
    padding:50px 35px;
    border-radius:28px;
    box-shadow:0 20px 60px rgba(0,0,0,.15);
}
.logo-wrap{
    width:185px;
    height:185px;
    border-radius:50%;
    margin:0 auto 34px;
    padding:6px;
    background:rgba(250,246,241,.45);
    box-shadow:0 0 28px rgba(250,246,241,.75),0 0 55px rgba(250,246,241,.35);
}
.logo{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    display:block;
}
h1{
    color:#2B2522;
    font-size:48px;
    margin:0 0 25px;
}
p{
    color:#2B2522;
    font-size:21px;
    line-height:1.6;
}
.small{
    color:#7A5A4B;
    margin-top:25px;
}
@media(max-width:520px){
    h1{font-size:38px;}
    p{font-size:18px;}
    .logo-wrap{width:150px;height:150px;}
    .card{padding:38px 24px;}
}
</style>
</head>
<body>
<div class="card">
    <div class="logo-wrap">
        <img src="logo.png" alt="Cábala Pastas" class="logo">
    </div>
    <h1>Pedido recibido</h1>
    <p>
        Gracias por elegir Cábala Pastas.<br>
        En breve me comunico por WhatsApp para confirmar tu pedido,
        coordinar entrega o retiro y cerrar el pago.
    </p>
    <p class="small">
        Mientras tanto tomate unos mates y confiá en la cábala,
        tu ritual de buena suerte ✨
    </p>
</div>
</body>
</html>
