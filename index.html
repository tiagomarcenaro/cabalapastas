<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido recibido | Cábala Pastas</title>

<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#C86F3D;
    font-family: Georgia, serif;
    padding:20px;
}

.card{
    background:#FAF6F1;
    max-width:700px;
    text-align:center;
    padding:50px 35px;
    border-radius:28px;
    box-shadow:0 20px 60px rgba(0,0,0,.15);
}

.logo{
    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:50%;
    display:block;
    margin:0 auto 25px;

    border:6px solid rgba(250,246,241,0.4);
    box-shadow:
        0 0 30px rgba(250,246,241,0.7),
        0 0 60px rgba(250,246,241,0.35);
}

h1{
    color:#2B2522;
    font-size:48px;
    margin-bottom:25px;
}

p{
    color:#2B2522;
    font-size:21px;
    line-height:1.6;
}

.small{
    color:#7A5A4B;
    margin-top:25px;
}

.button{
    display:inline-block;
    margin-top:25px;
    padding:12px 22px;
    background:#C86F3D;
    color:#FAF6F1;
    text-decoration:none;
    border-radius:10px;
    font-size:18px;
}
</style>
</head>

<body>

<div class="card">

    <img src="logo.png" alt="Cábala Pastas" class="logo">

    <h1>Pedido recibido</h1>

    <p>
        Gracias por elegir Cábala Pastas.<br>
        En breve me comunico por WhatsApp para confirmar tu pedido,
        coordinar entrega o retiro y cerrar el pago.
    </p>

    <p class="small">
        Mientras tanto tomate unos mates y confiá en la cábala,
        tu ritual de buena suerte ✨
    </p>

</div>

</body>
</html>
